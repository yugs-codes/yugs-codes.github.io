<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Yugal Joshi — MS Researcher at IIT Madras working on differential privacy, correlated noise mechanisms, and efficient learning systems." />
    <meta name="theme-color" content="#f5f5f2" />
    <title>Yugal Joshi — Researcher & Systems Engineer</title>
    <script>
      (() => {
        const saved = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
